; VENDX data vending machine — ESP32 firmware
;
; NOTE on `platform`: the OFFICIAL platformio/espressif32 (7.1.3) still ships
; Arduino core 2.0.17 from 2024 — Espressif stopped feeding new Arduino cores
; into it. Every library below targets Arduino 3.x, so we use the community
; pioarduino fork, which tracks Arduino core 3.3.x / ESP-IDF 5.5.x.
;
; NOTE on lib pinning: ESPAsyncWebServer 3.12.0 is a hard breaking change that
; REQUIRES AsyncTCP >= 3.5.0 (abort() became synchronous). Pin both together or
; you get runtime failures. The library also moved org: me-no-dev is abandoned,
; ESP32Async is the maintained home.

[platformio]
default_envs = esp32c3

[env]
framework = arduino
monitor_speed = 115200
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

build_flags =
    ; Async callbacks run on AsyncTCP's own task, not loop(). The default stack
    ; overflows once you do crypto in a handler. This is the #1 crash cause.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DVENDX_PRICE_MICRO_USDC=10000

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.3
    h2zero/NimBLE-Arduino @ ^2.5.1

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv

[env:esp32c3]
; Matches the attached Hack the North badge: ESP32-C3, single-core RISC-V
; @160MHz. This is the real target — esp32s3/esp32dev are kept for other boards.
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
