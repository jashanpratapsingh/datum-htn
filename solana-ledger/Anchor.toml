[toolchain]
anchor_version = "0.31.1"
# Bumped from 0.30.1 → 0.31.1 to fix IDL generation.
# anchor-syn 0.30.1 called proc_macro2::Span::source_file(), removed from
# proc_macro2 1.0.107 when nightly 1.100 dropped the underlying proc_macro_span API.
# anchor-syn 0.31.1 uses a different IDL extraction path that does not need source_file.

[features]
resolution = true
skip-lint = false

[programs.localnet]
vendx_zk = "VnDXzkZKqiG2X8kGBJYDqExQEuCz9TnshCHsf2WVEoY"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
